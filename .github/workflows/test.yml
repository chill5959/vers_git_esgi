name: Premier WF

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Exécuter le script
        run: bash scripts/hello.sh

      - name : Analyse script
        run: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Fini
        run: echo "wf fini"