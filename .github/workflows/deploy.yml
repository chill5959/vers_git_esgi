name: deploiement

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Recup depot
        uses: actions/checkout@v4
      - name: deployer
        run: scp -r ./scripts root@192.168.122.154:/var/www/git